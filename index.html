<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperplane - Your client's marketing brain, automated</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hero">
        
        <div class="content">
            <div class="logo-container">
                <img src="paperplane.png" alt="Paperplane Logo" class="logo">
            </div>
            
            <h1 class="headline">
                Your client's marketing brain, <span class="gradient-text">automated.</span>
            </h1>
            
            <p class="description">
                Paperplane learns every client — brand tone, offers, psychology, and performance — to build smarter campaigns automatically.
            </p>
            
            <button class="cta-button" onclick="sendEmail()">
                Join Early Access
            </button>
        </div>
    </main>
    
    <script>
        function sendEmail() {
            const subject = encodeURIComponent('Join Early Access - Paperplane');
            const body = encodeURIComponent('Hi,\n\nI would like to join the early access program for Paperplane.\n\nBest regards,');
            const email = 'join@mypaperplane.io';
            
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
