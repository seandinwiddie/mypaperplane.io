<body>
    <main class="hero" role="main">
        <div class="content">
            <header class="logo-container">
                <img src="paperplane.png" alt="Paperplane - Marketing Automation Platform Logo" class="logo" width="200" height="200">
            </header>
            
            <section class="hero-content">
                <h1 class="headline">
                    Your client's marketing brain, <span class="gradient-text">automated.</span>
                </h1>
                
                <p class="description">
                    Paperplane learns every client — brand tone, offers, psychology, and performance — to build smarter campaigns automatically.
                </p>
                
                <div class="cta-section">
                    <button class="cta-button" onclick="sendEmail()" aria-label="Join Early Access Program">
                        Join Early Access
                    </button>
                    <p class="cta-subtext">Limited to 10 agency founders</p>
                </div>
            </section>
        </div>
    </main>
    
    <script>
        function sendEmail() {
            const subject = encodeURIComponent('Join Early Access - Paperplane');
            const body = encodeURIComponent('Hi,\n\nI would like to join the early access program for Paperplane.\n\nBest regards,');
            const email = 'join@mypaperplane.io';
            
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }
    </script>
